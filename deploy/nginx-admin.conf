# administrator.atamura.group → кокпит (127.0.0.1:8090), ЗА basic-auth. TLS добавит certbot.
server {
    listen 80;
    server_name administrator.atamura.group;

    location / {
        auth_basic           "ATAMURA Core";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;   # htpasswd -c ... (см. DEPLOY.md)
        proxy_pass           http://127.0.0.1:8090;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_read_timeout   60s;
    }
}
